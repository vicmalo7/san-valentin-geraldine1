<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Árbol del Amor ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:radial-gradient(circle at top,#1a001f,#000);
overflow:hidden;
color:white;
font-family:'Poppins',sans-serif;
text-align:center;
}

h1{
font-family:'Great Vibes',cursive;
font-size:3.5rem;
margin-top:30px;
color:#ff4da6;
text-shadow:0 0 15px #ff4da6;
}

.tree{
position:relative;
width:100%;
height:70vh;
}

.trunk{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:40px;
height:250px;
background:#2b1b0f;
border-radius:20px;
box-shadow:0 0 20px #ff4da6;
}

.branch{
position:absolute;
width:200px;
height:10px;
background:#2b1b0f;
top:200px;
border-radius:20px;
}

.left{
left:calc(50% - 200px);
transform:rotate(-35deg);
}

.right{
right:calc(50% - 200px);
transform:rotate(35deg);
}

.heart{
position:absolute;
color:#ff4da6;
font-size:20px;
animation:glow 2s infinite alternate, float 4s infinite ease-in-out;
}

@keyframes glow{
from{text-shadow:0 0 5px #ff4da6;}
to{text-shadow:0 0 20px #ff1a8c;}
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

button{
margin-top:20px;
padding:12px 35px;
background:#ff1a8c;
border:none;
color:white;
font-size:1.2rem;
border-radius:30px;
cursor:pointer;
box-shadow:0 0 15px #ff1a8c;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

.hidden{
display:none;
margin-top:20px;
font-size:1.5rem;
color:#ff4da6;
text-shadow:0 0 15px #ff4da6;
}
</style>
</head>

<body>

<h1>Geraldine Arias Idarraga</h1>

<div class="tree">
<div class="trunk"></div>
<div class="branch left"></div>
<div class="branch right"></div>
</div>

<button onclick="showMessage()">¿Serías mi San Valentín? 💖</button>

<div id="message" class="hidden">
✨ Entonces este árbol crecerá contigo ✨
</div>

<script>
const tree=document.querySelector(".tree");

for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=(window.innerWidth/2 -150 + Math.random()*300)+"px";
heart.style.top=(100 + Math.random()*200)+"px";
heart.style.animationDelay=Math.random()*4+"s";
tree.appendChild(heart);
}

function showMessage(){
document.getElementById("message").classList.remove("hidden");
}
</script>

</body>
</html>
