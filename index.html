<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Geraldine 🌿</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:linear-gradient(to bottom,#f8f4ec,#e8dfcf);
font-family:'Cormorant Garamond',serif;
text-align:center;
color:#3b2f2f;
overflow:hidden;
}

h1{
margin-top:40px;
font-family:'Playfair Display',serif;
font-size:3rem;
letter-spacing:1px;
}

p{
font-size:1.4rem;
width:70%;
margin:auto;
margin-top:20px;
line-height:1.6;
}

.container{
position:relative;
height:500px;
margin-top:40px;
}

.trunk{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:30px;
height:220px;
background:#4b3621;
border-radius:20px;
}

.branch{
position:absolute;
width:120px;
height:10px;
background:#4b3621;
top:200px;
border-radius:20px;
}

.left{
left:calc(50% - 120px);
transform:rotate(-30deg);
}

.right{
right:calc(50% - 120px);
transform:rotate(30deg);
}

.leaf{
position:absolute;
width:14px;
height:14px;
background:gold;
border-radius:50%;
animation:float 6s infinite ease-in-out;
opacity:0.8;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

button{
margin-top:40px;
padding:14px 40px;
font-size:1.2rem;
border:1px solid #3b2f2f;
background:transparent;
cursor:pointer;
transition:all 0.4s ease;
font-family:'Playfair Display',serif;
}

button:hover{
background:#3b2f2f;
color:white;
letter-spacing:2px;
}

.hidden{
display:none;
font-size:1.6rem;
margin-top:30px;
}
</style>
</head>

<body>

<h1>Geraldine Arias Idarraga</h1>

<p>
Como las raíces sostienen al árbol, así tu presencia sostiene mi mundo.
Con respeto, admiración y el corazón en la mano…
</p>

<div class="container">
<div class="trunk"></div>
<div class="branch left"></div>
<div class="branch right"></div>

<script>
for(let i=0;i<30;i++){
let leaf=document.createElement("div");
leaf.className="leaf";
leaf.style.top=Math.random()*200+"px";
leaf.style.left=(window.innerWidth/2 - 100 + Math.random()*200)+"px";
leaf.style.animationDelay=Math.random()*6+"s";
document.querySelector(".container").appendChild(leaf);
}
</script>

</div>

<button onclick="showMessage()">¿Aceptarías ser mi San Valentín?</button>

<div id="message" class="hidden">
🌿 Prometo cuidarte como el árbol cuida cada una de sus hojas.
</div>

<script>
function showMessage(){
document.getElementById("message").classList.remove("hidden");
}
</script>

</body>
</html>
