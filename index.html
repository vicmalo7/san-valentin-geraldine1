<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol del Amor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0f0f14;
overflow:hidden;
font-family:'Poppins',sans-serif;
color:white;
text-align:center;
}

h1{
margin-top:30px;
font-weight:500;
}

canvas{
display:block;
margin:auto;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff2e88;
color:white;
font-size:1rem;
cursor:pointer;
box-shadow:0 0 15px #ff2e88;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

#mensaje{
margin-top:15px;
font-size:1.2rem;
opacity:0;
transition:0.5s;
}
</style>
</head>

<body>

<h1>Geraldine Arias Idarraga</h1>

<canvas id="treeCanvas"></canvas>

<button onclick="mostrar()">¿Quieres ser mi San Valentín?</button>

<div id="mensaje">Entonces este árbol sigue creciendo contigo.</div>

<script>
const canvas=document.getElementById("treeCanvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight*0.65;

let branches=[];

function branch(x,y,len,angle,depth){
if(depth===0) return;

let x2=x+len*Math.cos(angle);
let y2=y+len*Math.sin(angle);

branches.push({x,y,x2,y2});

setTimeout(()=>{
branch(x2,y2,len*0.75,angle-0.4,depth-1);
branch(x2,y2,len*0.75,angle+0.4,depth-1);
},300);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle="#ff2e88";
ctx.lineWidth=2;
ctx.shadowBlur=15;
ctx.shadowColor="#ff2e88";

branches.forEach(b=>{
ctx.beginPath();
ctx.moveTo(b.x,b.y);
ctx.lineTo(b.x2,b.y2);
ctx.stroke();
});
}

branch(canvas.width/2,canvas.height,100,-Math.PI/2,8);

function animate(){
draw();
requestAnimationFrame(animate);
}

animate();

function mostrar(){
document.getElementById("mensaje").style.opacity="1";
}
</script>

</body>
</html>
