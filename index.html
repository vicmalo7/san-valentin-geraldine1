<title>Árbol del Amor ❤️</title>

<style>
body{
    margin:0;
    background:#f7e7d7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    position:relative;
    width:400px;
    height:500px;
}

/* TRONCO */
.trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:200px;
    background:#8b5a2b;
    clip-path:polygon(40% 0%, 60% 0%, 70% 100%, 30% 100%);
}

/* CORAZONES */
.heart{
    position:absolute;
    width:18px;
    height:18px;
    background:red;
    transform:rotate(45deg);
    animation:float 4s ease-in-out infinite;
}

.heart::before,
.heart::after{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    background:red;
    border-radius:50%;
}

.heart::before{
    top:-9px;
    left:0;
}

.heart::after{
    left:-9px;
    top:0;
}

/* Animación suave */
@keyframes float{
    0%{ transform:rotate(45deg) translateY(0px); }
    50%{ transform:rotate(45deg) translateY(-8px); }
    100%{ transform:rotate(45deg) translateY(0px); }
}
</style>
</head>
<body>

<div class="container">
    <div class="trunk"></div>
</div>
